<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8"><title>Odontomed - Цаг захиалга</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--p:#12B8B0;--pd:#0e8f89;--bg:#f4fbfb;--card:#fff;--tx:#1d2b2b;--mu:#6b7f7f;--bd:#dcecec;--rd:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1818;--card:#142424;--tx:#e8f4f3;--mu:#8fa8a7;--bd:#244040}}
:root[data-theme=dark]{--bg:#0d1818;--card:#142424;--tx:#e8f4f3;--mu:#8fa8a7;--bd:#244040}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,"Segoe UI",Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.coin{position:relative;transform-style:preserve-3d;animation:spin 7s linear infinite}.coin img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}.coin img+img{transform:rotateY(180deg)}.logo{width:48px;height:48px;flex:none}
@keyframes spin{to{transform:rotateY(360deg)}}
.brand{font-weight:700;letter-spacing:.5px}.brand small{display:block;font-weight:400;color:var(--mu);font-size:12px}
nav{margin-left:auto;display:flex;gap:8px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;background:var(--p);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.s{padding:6px 10px;font-size:13px}button.r{background:var(--rd)}
button:disabled{opacity:.4;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;max-width:1100px;margin:0 auto;padding:40px 20px}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:0 0 12px}.hero h1 span{color:var(--p)}
.hero p{color:var(--mu);margin:0 0 20px}.big{width:min(260px,70%);aspect-ratio:1;margin:auto;filter:drop-shadow(0 20px 30px rgba(18,184,176,.35))}
main{max-width:1100px;margin:0 auto;padding:0 20px 60px}h2{margin:30px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(18,184,176,.07)}
.doc{cursor:pointer;transition:.2s}.doc:hover,.doc.on{border-color:var(--p);transform:translateY(-3px)}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--p),#7fe3dd);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin-bottom:10px}
.tag{display:inline-block;background:rgba(18,184,176,.14);color:var(--pd);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
@media(prefers-color-scheme:dark){.tag{color:var(--p)}}
.row{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;color:var(--tx)}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}.chip.x{opacity:.35;pointer-events:none;text-decoration:line-through}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}.ok{background:rgba(18,184,176,.12);border:1px solid var(--p);border-radius:14px;padding:14px;margin-top:12px}
.bo{display:none}.bo.show{display:block}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:520px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}
.pill{border-radius:20px;padding:2px 8px;font-size:12px;background:var(--bd)}.pill.n{background:var(--p);color:#fff}.pill.b{background:var(--rd);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lg{filter:drop-shadow(0 0 1px #fff) brightness(1.15)}}@media(max-width:760px){.hero{grid-template-columns:1fr}.big{order:-1;width:150px}}
</style></head><body>
<header><div class="coin logo"><img class="lg" alt="Odontomed"><img class="lg" alt=""></div><div class="brand">ODONTOMED<small>Dental Clinic</small></div>
<nav><button class="g s" id="nv1">Цаг захиалах</button><button class="g s" id="nv2">Back office</button></nav></header>

<div id="pub">
<section class="hero"><div><h1>Инээмсэглэлээ <span>итгэлтэй</span> бидэнд даатга</h1><p>Өөрт тохирсон эмчээ сонгоод, 1 минутанд онлайнаар цаг аваарай. Цагийн өмнөх өдөр танд сануулга очно.</p><button id="go">Цаг авах</button><p style="margin-top:14px;font-size:13px">Ажлын өдөр 09:00 - 20:00 · Амралтын өдөр 10:00 - 18:00</p></div>
<div class="coin big"><img class="lg" alt="Odontomed"><img class="lg" alt=""></div></section>
<main><h2>Манай эмч нар</h2><div class="grid" id="docs"></div>
<h2>Цаг захиалах</h2><div class="card" id="bk"><label>Сонгосон эмч</label><div id="sel" style="font-weight:600;margin-bottom:10px">Дээрээс эмчээ сонгоно уу</div>
<label>Өдөр</label><div class="row" id="days" style="margin:6px 0 12px"></div><label>Цаг</label><div class="row" id="slots" style="margin:6px 0 12px"></div>
<label>Нэр</label><input id="nm" placeholder="Таны нэр"><label>Утас</label><input id="ph" inputmode="tel" placeholder="99112233">
<button id="sub" disabled>Баталгаажуулах</button><div id="res"></div></div></main></div>

<div id="bo" class="bo"><main><h2>Back office</h2>
<div class="card" id="lg" style="max-width:340px"><label>Эмчийн нэвтрэх PIN (demo: 1234)</label><input id="pin" type="password" inputmode="numeric"><button id="in">Нэвтрэх</button></div>
<div id="app" style="display:none"><div class="tabs"><button class="s" data-t="sch">Хуваарь</button><button class="g s" data-t="rem">Сануулга (маргааш)</button><button class="g s" data-t="all">Бүх цаг</button><button class="g s" id="out" style="margin-left:auto">Гарах</button></div>
<div id="v"></div></div></main></div>

const D=[["Төгөлсүрэн","Эмчилгээний эмч"],["Цэцэгээ","Гажиг засал"],["Сувд-Эрдэнэ","Эмчилгээний эмч"],["Цэдэнсодном","Эмчилгээний эмч"],["Цолмон","Эмчилгээний эмч"],["Болормаа","Гажиг засал"],["Манлай","Шүдний имплант"],["Халиунаа","Мэсийн эмч"],["Ариунболд","Шүдний бүрээс"]];
const S=ds=>{const w=[0,6].includes(new Date(ds+"T00:00").getDay()),a=w?10:9,b=w?18:20,r=[];for(let h=a;h<b;h++){const p=String(h).padStart(2,"0");r.push(p+":00");r.push(p+":30")}return r};
const $=i=>document.getElementById(i),fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const WD=["Ням","Дав","Мяг","Лха","Пүр","Баа","Бям"];
let A=[];try{A=JSON.parse(localStorage.getItem("odm")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("odm",JSON.stringify(A))}catch(e){}};
const dates=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);dates.push(d)}
let st={doc:null,date:fmt(dates[0]),time:null},bo={doc:0,date:fmt(dates[0]),tab:"sch",ok:false};
const taken=(d,dt,t)=>A.find(a=>a.doc==d&&a.date==dt&&a.time==t&&a.status!="cancel");
const dl=d=>`${WD[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`;
function show(p){$("pub").style.display=p?"":"none";$("bo").classList.toggle("show",!p);scrollTo(0,0)}
$("nv1").onclick=()=>show(1);$("nv2").onclick=()=>show(0);$("go").onclick=()=>$("docs").scrollIntoView({behavior:"smooth"});
$("docs").innerHTML=D.map((d,i)=>`<div class="card doc" data-i="${i}"><div class="av">${d[0][0]}</div><b>${d[0]}</b><br><span class="tag">${d[1]}</span></div>`).join("");
$("docs").onclick=e=>{const c=e.target.closest(".doc");if(!c)return;st.doc=+c.dataset.i;st.time=null;draw();$("bk").scrollIntoView({behavior:"smooth"})};
function draw(){document.querySelectorAll(".doc").forEach(c=>c.classList.toggle("on",+c.dataset.i===st.doc));
$("sel").textContent=st.doc===null?"Дээрээс эмчээ сонгоно уу":D[st.doc][0]+" - "+D[st.doc][1];
$("days").innerHTML=dates.map(d=>`<span class="chip ${fmt(d)==st.date?"on":""}" data-d="${fmt(d)}">${dl(d)}</span>`).join("");
$("slots").innerHTML=st.doc===null?"":S(st.date).map(t=>`<span class="chip ${taken(st.doc,st.date,t)?"x":""} ${t==st.time?"on":""}" data-t="${t}">${t}</span>`).join("");
$("sub").disabled=!(st.doc!==null&&st.time&&$("nm").value.trim()&&$("ph").value.trim().length>=8)}
$("days").onclick=e=>{if(e.target.dataset.d){st.date=e.target.dataset.d;st.time=null;draw()}};
$("slots").onclick=e=>{if(e.target.dataset.t){st.time=e.target.dataset.t;draw()}};
$("nm").oninput=$("ph").oninput=draw;
$("sub").onclick=()=>{if(taken(st.doc,st.date,st.time))return draw();A.push({id:Date.now(),doc:st.doc,date:st.date,time:st.time,name:$("nm").value.trim(),phone:$("ph").value.trim(),status:"new",notified:false});save();
$("res").innerHTML=`<div class="ok"><b>Таны цаг амжилттай захиалагдлаа</b><br>${D[st.doc][0]} - ${st.date} ${st.time}<br><small>Цагийн өмнөх өдөр танд сануулга очно.</small></div>`;st.time=null;$("nm").value=$("ph").value="";draw()};
$("in").onclick=()=>{if($("pin").value=="1234"){bo.ok=true;$("lg").style.display="none";$("app").style.display="block";view()}else $("pin").value=""};
$("out").onclick=()=>{bo.ok=false;$("lg").style.display="";$("app").style.display="none";$("pin").value=""};
document.querySelector(".tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;bo.tab=t;document.querySelectorAll(".tabs [data-t]").forEach(b=>b.className=(b.dataset.t==t?"":"g ")+"s");view()};
const nm=a=>a.type=="block"?"Хаалттай":a.name;
function view(){const v=$("v");
if(bo.tab=="sch"){v.innerHTML=`<div class="row"><select id="bd" style="max-width:220px">${D.map((d,i)=>`<option value="${i}" ${i==bo.doc?"selected":""}>${d[0]} - ${d[1]}</option>`).join("")}</select><select id="bdt" style="max-width:140px">${dates.map(d=>`<option value="${fmt(d)}" ${fmt(d)==bo.date?"selected":""}>${dl(d)}</option>`).join("")}</select></div>
<div class="card tb"><table>${S(bo.date).map(t=>{const a=taken(bo.doc,bo.date,t);return`<tr><td>${t}</td><td>${a?`<b>${nm(a)}</b> <small>${a.phone||""}</small>`:"<span style='color:var(--mu)'>Сул</span>"}</td><td style="text-align:right">${a?`<button class="r s" data-c="${a.id}">Цуцлах</button>`:`<button class="s" data-a="${t}">Цаг зоох</button> <button class="g s" data-b="${t}">Хаах</button>`}</td></tr>`}).join("")}</table></div>`;
$("bd").onchange=e=>{bo.doc=+e.target.value;view()};$("bdt").onchange=e=>{bo.date=e.target.value;view()}}
else if(bo.tab=="rem"){const tm=new Date();tm.setDate(tm.getDate()+1);const k=fmt(tm),L=A.filter(a=>a.date==k&&a.status!="cancel"&&a.type!="block");
v.innerHTML=`<p style="color:var(--mu)">Маргааш (${k}) цагтай хүмүүс. "Илгээх" дарахад утсанд SMS бэлэн нээгдэнэ.</p><div class="card tb"><table>${L.map(a=>`<tr><td>${a.time}</td><td>${a.name}<br><small>${a.phone}</small></td><td>${D[a.doc][0]}</td><td>${a.notified?'<span class="pill n">Илгээсэн</span>':`<a class="btn s" style="padding:6px 10px;font-size:13px;text-decoration:none;display:inline-block" data-n="${a.id}" href="sms:${a.phone}?&body=${encodeURIComponent("Сайн байна уу "+a.name+", Odontomed шүдний эмнэлэгт маргааш "+a.time+" цагт "+D[a.doc][0]+" эмчид цагтай байна.")}">Илгээх</a>`}</td></tr>`).join("")||"<tr><td>Маргааш цаг байхгүй</td></tr>"}</table></div>`}
else{const L=[...A].filter(a=>a.type!="block").sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
v.innerHTML=`<div class="card tb"><table><tr><th>Огноо</th><th>Эмч</th><th>Үйлчлүүлэгч</th><th></th></tr>${L.map(a=>`<tr><td>${a.date} ${a.time}</td><td>${D[a.doc][0]}</td><td>${a.name} <small>${a.phone}</small></td><td>${a.status=="cancel"?'<span class="pill b">Цуцалсан</span>':'<span class="pill n">Идэвхтэй</span>'}</td></tr>`).join("")||"<tr><td>Цаг алга</td></tr>"}</table></div>`}}
$("v").onclick=e=>{const d=e.target.dataset,id=d.c||d.n;
if(d.c){const a=A.find(x=>x.id==d.c);a.status="cancel";save();view()}
else if(d.a){const n=prompt("Үйлчлүүлэгчийн нэр"),p=prompt("Утас")||"";if(n){A.push({id:Date.now(),doc:bo.doc,date:bo.date,time:d.a,name:n,phone:p,status:"new",notified:false});save();view()}}
else if(d.b){A.push({id:Date.now(),doc:bo.doc,date:bo.date,time:d.b,type:"block",status:"new"});save();view()}
else if(d.n){const a=A.find(x=>x.id==d.n);a.notified=true;save();setTimeout(view,300)}};
draw();
</script></body></html>
